name: Deploy via FTP para Locaweb

# Roda só quando algo é enviado pra branch main — evita publicar
# testes/experimentos de outras branches sem querer.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions, sem precisar de um push novo

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # A primeira execução com essa ferramenta ainda demora (ela precisa criar o
    # "arquivo de estado" do zero, comparando tudo). Depois disso, deploys ficam
    # rápidos (segundos), então mantenho uma folga só pra essa primeira vez.
    timeout-minutes: 45
    steps:
      # precisa=2: sem isso, a Action não consegue comparar com o commit anterior
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: FTP Deploy (envia só o que mudou)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          protocol: ftp # servidor da Locaweb recusa FTPS ("does not support or allow SSL") — confirmado
          port: 21
          local-dir: ./
          # CONFIRMADO via FileZilla: a conta de FTP é presa (chroot) em /home/codernex1/
          # — ao conectar, a raiz "/" já É essa pasta. Caminho relativo ao site real.
          server-dir: /public_html/sys01/
          # Diferente da ferramenta antiga: esta guarda um arquivo de estado
          # (.ftp-deploy-sync-state.json) na própria hospedagem e só envia o que
          # realmente mudou de conteúdo — não reenvia tudo a cada push.
          exclude: |
            **/.git*
            **/.git*/**
